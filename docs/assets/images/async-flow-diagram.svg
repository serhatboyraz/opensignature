<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-label="Async signing flow">
  <rect width="1100" height="280" fill="#f4f7f8"/>
  <text x="24" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a2e2f">Async Signing Flow</text>
  <!-- steps -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="24" y="70" width="130" height="90" rx="8" fill="#1f6f78"/>
    <text x="89" y="108" text-anchor="middle" font-size="12" fill="#fff">1. Client</text>
    <text x="89" y="128" text-anchor="middle" font-size="11" fill="#d7f1f4">POST /signatures</text>
    <polygon points="164,115 178,115 178,108 194,120 178,132 178,125 164,125" fill="#3d5a5b"/>

    <rect x="204" y="70" width="130" height="90" rx="8" fill="#2a8a94"/>
    <text x="269" y="108" text-anchor="middle" font-size="12" fill="#fff">2. API</text>
    <text x="269" y="128" text-anchor="middle" font-size="11" fill="#d7f1f4">store + outbox</text>
    <text x="269" y="146" text-anchor="middle" font-size="11" fill="#d7f1f4">202 Accepted</text>
    <polygon points="344,115 358,115 358,108 374,120 358,132 358,125 344,125" fill="#3d5a5b"/>

    <rect x="384" y="70" width="130" height="90" rx="8" fill="#ffffff" stroke="#b07a2a" stroke-width="2"/>
    <text x="449" y="108" text-anchor="middle" font-size="12" fill="#1a2e2f">3. RabbitMQ</text>
    <text x="449" y="128" text-anchor="middle" font-size="11" fill="#4a6364">refs only</text>
    <polygon points="524,115 538,115 538,108 554,120 538,132 538,125 524,125" fill="#3d5a5b"/>

    <rect x="564" y="70" width="130" height="90" rx="8" fill="#1f6f78"/>
    <text x="629" y="108" text-anchor="middle" font-size="12" fill="#fff">4. Worker</text>
    <text x="629" y="128" text-anchor="middle" font-size="11" fill="#d7f1f4">lock · sign</text>
    <polygon points="704,115 718,115 718,108 734,120 718,132 718,125 704,125" fill="#3d5a5b"/>

    <rect x="744" y="70" width="130" height="90" rx="8" fill="#ffffff" stroke="#5a7a4a" stroke-width="2"/>
    <text x="809" y="108" text-anchor="middle" font-size="12" fill="#1a2e2f">5. Storage</text>
    <text x="809" y="128" text-anchor="middle" font-size="11" fill="#4a6364">signed.bin</text>
    <polygon points="884,115 898,115 898,108 914,120 898,132 898,125 884,125" fill="#3d5a5b"/>

    <rect x="924" y="70" width="150" height="90" rx="8" fill="#2a8a94"/>
    <text x="999" y="108" text-anchor="middle" font-size="12" fill="#fff">6. Client</text>
    <text x="999" y="128" text-anchor="middle" font-size="11" fill="#d7f1f4">GET status</text>
    <text x="999" y="146" text-anchor="middle" font-size="11" fill="#d7f1f4">GET content</text>
  </g>
  <text x="24" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a6364">Document binaries never travel on RabbitMQ. PostgreSQL stores metadata and outbox rows only.</text>
  <text x="24" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4a6364">Hardware providers sign digests on-device; private keys are never exported.</text>
</svg>
