<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="OpenSignature architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7f8"/>
      <stop offset="100%" stop-color="#e8eef1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3d5a5b"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="40" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1a2e2f">OpenSignature Architecture</text>
  <text x="40" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#4a6364">Async signing · PostgreSQL metadata · RabbitMQ job refs · Hardware-backed providers</text>

  <!-- Client -->
  <rect x="480" y="100" width="240" height="56" rx="8" fill="#1f6f78" stroke="#14545b" stroke-width="1.5"/>
  <text x="600" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#dff5f7">OpenSignature.Web</text>
  <text x="600" y="143" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#b8e4e8">React / Vite UI</text>

  <line x1="600" y1="156" x2="600" y2="188" stroke="#3d5a5b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API -->
  <rect x="420" y="190" width="360" height="64" rx="8" fill="#2a8a94" stroke="#1f6f78" stroke-width="1.5"/>
  <text x="600" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">OpenSignature.Api</text>
  <text x="600" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#d7f1f4">ASP.NET Core Minimal API · 202 Accepted</text>

  <!-- App layers -->
  <rect x="300" y="290" width="180" height="50" rx="6" fill="#ffffff" stroke="#2a8a94" stroke-width="1.5"/>
  <text x="390" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a2e2f">Application</text>
  <rect x="510" y="290" width="180" height="50" rx="6" fill="#ffffff" stroke="#2a8a94" stroke-width="1.5"/>
  <text x="600" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a2e2f">Domain</text>
  <rect x="720" y="290" width="180" height="50" rx="6" fill="#ffffff" stroke="#2a8a94" stroke-width="1.5"/>
  <text x="810" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a2e2f">Infrastructure</text>

  <line x1="500" y1="254" x2="390" y2="288" stroke="#3d5a5b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="254" x2="600" y2="288" stroke="#3d5a5b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="254" x2="810" y2="288" stroke="#3d5a5b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Infra deps -->
  <rect x="80" y="400" width="200" height="70" rx="8" fill="#ffffff" stroke="#5a7a4a" stroke-width="1.5"/>
  <text x="180" y="430" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a2e2f">PostgreSQL</text>
  <text x="180" y="450" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4a6364">metadata · jobs · outbox · audit</text>

  <rect x="320" y="400" width="200" height="70" rx="8" fill="#ffffff" stroke="#5a7a4a" stroke-width="1.5"/>
  <text x="420" y="430" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a2e2f">File Storage</text>
  <text x="420" y="450" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4a6364">input.bin · signed.bin</text>

  <rect x="560" y="400" width="200" height="70" rx="8" fill="#ffffff" stroke="#b07a2a" stroke-width="1.5"/>
  <text x="660" y="430" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a2e2f">RabbitMQ</text>
  <text x="660" y="450" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4a6364">job references only</text>

  <line x1="720" y1="340" x2="180" y2="398" stroke="#3d5a5b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="340" x2="420" y2="398" stroke="#3d5a5b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="810" y1="340" x2="660" y2="398" stroke="#3d5a5b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Worker -->
  <rect x="820" y="400" width="280" height="70" rx="8" fill="#1f6f78" stroke="#14545b" stroke-width="1.5"/>
  <text x="960" y="430" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#dff5f7">OpenSignature.Worker</text>
  <text x="960" y="450" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#b8e4e8">consume · lock · sign · ACK</text>

  <line x1="760" y1="435" x2="818" y2="435" stroke="#3d5a5b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Signing -->
  <rect x="300" y="520" width="700" height="56" rx="8" fill="#2a8a94" stroke="#1f6f78" stroke-width="1.5"/>
  <text x="650" y="545" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">OpenSignature.Signing · ISigningProvider · Format engines</text>
  <text x="650" y="563" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#d7f1f4">PAdES · XAdES · CAdES · ASiC-S/E · Validation</text>

  <line x1="960" y1="470" x2="650" y2="518" stroke="#3d5a5b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Providers -->
  <rect x="220" y="620" width="150" height="44" rx="6" fill="#ffffff" stroke="#2a8a94" stroke-width="1.5"/>
  <text x="295" y="647" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a2e2f">PFX (dev)</text>
  <rect x="400" y="620" width="150" height="44" rx="6" fill="#ffffff" stroke="#2a8a94" stroke-width="1.5"/>
  <text x="475" y="647" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a2e2f">PKCS#11</text>
  <rect x="580" y="620" width="150" height="44" rx="6" fill="#ffffff" stroke="#2a8a94" stroke-width="1.5"/>
  <text x="655" y="647" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a2e2f">Smart Card</text>
  <rect x="760" y="620" width="150" height="44" rx="6" fill="#ffffff" stroke="#2a8a94" stroke-width="1.5"/>
  <text x="835" y="647" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a2e2f">HSM</text>

  <line x1="400" y1="576" x2="295" y2="618" stroke="#3d5a5b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="520" y1="576" x2="475" y2="618" stroke="#3d5a5b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="700" y1="576" x2="655" y2="618" stroke="#3d5a5b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="820" y1="576" x2="835" y2="618" stroke="#3d5a5b" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>
