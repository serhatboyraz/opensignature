# OpenSignature local development dependencies (PostgreSQL + RabbitMQ).
# Copy .env.example to .env, then: docker compose up -d

name: opensignature

services:
  postgres:
    image: postgres:16-alpine
    container_name: opensignature-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opensignature}
      POSTGRES_USER: ${POSTGRES_USER:-esign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esign}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - opensignature
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: opensignature-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-esign}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-esign}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - opensignature
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  opensignature:
    name: opensignature
    driver: bridge
